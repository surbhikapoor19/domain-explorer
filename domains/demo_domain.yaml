domain: demo_domain
display_name: "Demo Domain"
display_subject: "robotic grasp planning methods"
display_short: "grasp planning"
ecosystem: "COMPARE Ecosystem"
tagline: "AI-in-the-Loop"
query_hint: 'e.g., sampling-based 6-DoF grasp generation using point clouds'
method_noun: "method"
explorer_enabled: true

csv_path: datasets/demo-domain/demo_domain.csv
papers_dir: datasets/demo-domain/papers/
drive_folder: "https://drive.google.com/drive/folders/1f-JtiBHwNfy9ewRrJd2zL7u5WH34YUBB"

columns:
  "Name": { role: identity.name, facet: identifier }
  "Description": { role: identity.description, facet: text }
  "Planning Method": { role: method.family, facet: categorical }
  "Input Data": { role: input.modality, facet: categorical }
  "End-effector Hardware": { role: hardware.platform, facet: categorical }
  "Language": { role: meta.language, facet: categorical }
  "Link(s)": { role: identity.code, facet: url }
  "License": { role: meta.license, facet: categorical }
  "Citation": { role: identity.citation, facet: text }
  "Year (Initial Release)": { role: identity.year, facet: numeric }

llm:
  domain_subject: "robotic grasp planning for manipulation research"
  claim_extraction_focus:
    - "grasp success rate on standard benchmarks (e.g., YCB, DexYCB)"
    - "comparative performance against baseline methods such as GPD, Dex-Net, Contact-GraspNet"
    - "limitations related to sensor noise, occlusion, or object geometry complexity"
    - "transferability and deployment patterns from simulation to real-world robot platforms"
  query_rewrite_examples:
    - "What are the latest sampling-based grasp generation methods using point clouds?"
    - "Which grasp planning algorithms achieve the highest success rate on the YCB dataset?"
    - "How do direct regression approaches compare to optimization-based methods in terms of computation time?"

default_color_by_roles:
  - method.family
  - hardware.platform
  - input.modality
  - meta.language

extra_datasets:
  - "YCB"
  - "ShapeNet"
  - "DexYCB"
  - "GraspNet-1B"
  - "Cornell Grasping Dataset"
  - "Jacquard"
  - "EGAD"
  - "ContactDB"
  - "Amazon Picking Challenge"
  - "RoboNet"
  - "OpenGRASP"
  - "DexGrasp"
  - "Acronym"

extra_keywords:
  - "variational autoencoder"
  - "grasp sampler"
  - "grasp evaluator"
  - "6-DoF pose"
  - "point cloud"
  - "RGB-D"
  - "sim-to-real"
  - "self-supervised learning"
  - "grasp quality convolutional neural network"
  - "GQ-CNN"
  - "contact points"
  - "grasp width"
  - "two-finger gripper"
  - "antipodal grasp"
  - "grasp synthesis"
  - "domain randomization"
  - "analytic grasp metrics"
  - "collision checking"
  - "trajectory optimization"
  - "reinforcement learning"
