domain: demo_domain
display_name: "Demo Domain"
display_subject: "grasp planning methods"
display_short: "grasp planning"
ecosystem: "COMPARE Ecosystem"
tagline: "AI-in-the-Loop"
query_hint: 'e.g., find sampling-based methods using point clouds'
method_noun: "method"
explorer_enabled: true

csv_path: datasets/demo-domain/demo_domain.csv
papers_dir: datasets/demo-domain/papers/
drive_folder: "https://drive.google.com/drive/folders/1f-JtiBHwNfy9ewRrJd2zL7u5WH34YUBB?usp=sharing"

columns:
  "Name": { role: identity.name, facet: identifier }
  "Description": { role: identity.description, facet: text }
  "Planning Method": { role: method.family, facet: categorical }
  "Input Data": { role: input.modality, facet: categorical }
  "End-effector Hardware": { role: hardware.platform, facet: categorical }
  "Language": { role: meta.language, facet: categorical }
  "Link(s)": { role: identity.code, facet: url }
  "License": { role: meta.license, facet: categorical }
  "Citation": { role: identity.citation, facet: text }
  "Year (Initial Release)": { role: identity.year, facet: numeric }

llm:
  domain_subject: "grasp planning methods for robotic manipulation"
  claim_extraction_focus:
    - "reported success rates on standard benchmarks (e.g., YCB, GraspNet-1B)"
    - "comparative performance against baseline or prior methods"
    - "limitations related to sensor noise, object geometry, or computation time"
    - "transferability from simulation to real-world deployment and sim-to-real strategies"
  query_rewrite_examples:
    - "What are the latest sampling-based grasp planners that use point clouds?"
    - "Which grasp planning methods achieve over 90% success on the YCB dataset?"
    - "How do direct regression methods handle RGB-D inputs compared to depth-only inputs?"

default_color_by_roles:
  - method.family
  - hardware.platform
  - input.modality

extra_datasets:
  - "YCB"
  - "ShapeNet"
  - "Dex-Net"
  - "GraspNet-1B"
  - "Cornell Grasping Dataset"
  - "Jacquard"
  - "Amazon Picking Challenge"
  - "EGAD"
  - "ContactDB"
  - "RoboNet"

extra_keywords:
  - "variational autoencoder"
  - "grasp sampler"
  - "grasp refinement"
  - "6-DoF pose"
  - "point cloud segmentation"
  - "sim-to-real transfer"
  - "self-supervised learning"
  - "analytic grasp metrics"
  - "collision checking"
  - "grasp quality convolutional neural network"
  - "contact points"
  - "grasp width"
  - "depth image preprocessing"
  - "ROS integration"
  - "MoveIt"
  - "inverse kinematics"
  - "grasp affordance"
  - "domain randomization"
  - "synthetic data generation"
  - "real-time inference"
