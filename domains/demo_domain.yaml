domain: demo_domain
display_name: "Demo Domain"
display_subject: "robotic grasp planning methods"
display_short: "grasp planning"
ecosystem: "COMPARE Ecosystem"
tagline: "AI-in-the-Loop"
query_hint: 'sampling-based grasp generation using point clouds'
method_noun: "method"
explorer_enabled: true

csv_path: datasets/demo-domain/demo_domain.csv
papers_dir: datasets/demo-domain/papers/
drive_folder: "https://drive.google.com/drive/folders/1f-JtiBHwNfy9ewRrJd2zL7u5WH34YUBB?usp=sharing"

columns:
  "Name": { role: identity.name, facet: identifier }
  "Description": { role: identity.description, facet: text }
  "Planning Method": { role: method.family, facet: categorical }
  "Input Data": { role: input.modality, facet: categorical }
  "End-effector Hardware": { role: hardware.platform, facet: categorical }
  "Language": { role: meta.language, facet: categorical }
  "Link(s)": { role: identity.code, facet: url }
  "License": { role: meta.license, facet: categorical }
  "Citation": { role: identity.citation, facet: text }
  "Year (Initial Release)": { role: identity.year, facet: numeric }

llm:
  domain_subject: "Robotic grasp planning for manipulation research"
  claim_extraction_focus:
    - "Grasp success rate on standard benchmarks (e.g., YCB, Dex-YCB, GraspNet)"
    - "Planning runtime and computational efficiency compared across methods"
    - "Robustness to sensor noise, object pose uncertainty, and cluttered scenes"
    - "Sim-to-real transfer performance and real‑world deployment constraints"
  query_rewrite_examples:
    - "What are the latest sampling‑based grasp planning methods that use point clouds?"
    - "Which grasp generation algorithms achieve the highest success rate on the YCB dataset?"
    - "How do direct regression approaches compare in runtime to optimization‑based methods for 6‑DoF grasping?"

default_color_by_roles:
  - method.family
  - hardware.platform
  - input.modality
  - meta.language

extra_datasets:
  - "YCB Object and Model Set"
  - "Dex‑YCB"
  - "GraspNet-1B"
  - "Cornell Grasping Dataset"
  - "ContactDB"
  - "EGAD"
  - "RoboNet"
  - "Auburn Grasp Dataset"
  - "ObjectNet3D"

extra_keywords:
  - "variational autoencoder"
  - "grasp sampler"
  - "grasp evaluator"
  - "6‑DoF pose"
  - "point cloud"
  - "depth image"
  - "RGB‑D"
  - "sim‑to‑real"
  - "domain randomization"
  - "GQ‑CNN"
  - "contact points"
  - "grasp width"
  - "class‑agnostic"
  - "self‑supervised learning"
  - "analytic grasp metrics"
  - "collision checking"
  - "inverse kinematics"
  - "ROS MoveIt"
  - "trajectory optimization"
  - "policy network"
