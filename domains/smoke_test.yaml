domain: smoke_test
display_name: "Smoke Test Explorer"
display_subject: "6-DoF grasp planning methods"
display_short: "grasp planning"
ecosystem: "COMPARE Ecosystem"
tagline: "AI-in-the-Loop"
query_hint: 'Find 6-DoF grasp planning methods using point clouds'
method_noun: "method"
explorer_enabled: true

csv_path: datasets/smoke-test/smoke_test.csv
papers_dir: datasets/smoke-test/papers/

columns:
  "Name": { role: identity.name, facet: identifier }
  "Description": { role: identity.description, facet: text }
  "Planning Method": { role: method.family, facet: categorical }
  "Input Data": { role: input.modality, facet: categorical }
  "End-effector Hardware": { role: hardware.platform, facet: categorical }
  "Language": { role: meta.language, facet: categorical }
  "Link(s)": { role: identity.code, facet: url }
  "License": { role: meta.license, facet: categorical }
  "Citation": { role: identity.citation, facet: text }
  "Year (Initial Release)": { role: identity.year, facet: numeric }

llm:
  domain_subject: "6-DoF grasp planning"
  claim_extraction_focus:
    - "Success rate on standard grasp benchmarks (e.g., YCB, Dex-Net)"
    - "Comparison against baseline sampling or regression approaches"
    - "Sim-to-real transfer performance and real-world deployment results"
    - "Computation time, runtime efficiency, and scalability"
  query_rewrite_examples:
    - "What are the latest sampling-based 6-DoF grasp planners that use point clouds?"
    - "Which 6-DoF grasp methods support two-finger grippers and are implemented in Python?"
    - "How do direct regression grasp networks compare to sampling methods on common benchmarks?"

default_color_by_roles:
  - method.family
  - hardware.platform
  - input.modality
  - meta.language

extra_datasets:
  - "Dex-Net"
  - "GraspNet-1B"
  - "ContactDB"
  - "Cornell Grasping Dataset"
  - "EGAD"
  - "Auburn Robotics Dataset"
  - "Object Clutter Benchmark"
  - "Baxter Grasp Dataset"
  - "YCB-Video"
  - "Google Scanned Objects"

extra_keywords:
  - "variational autoencoder"
  - "grasp sampler"
  - "grasp evaluator"
  - "6-DoF pose"
  - "point cloud"
  - "depth image"
  - "RGB-D"
  - "sim-to-real"
  - "self-supervised learning"
  - "analytic grasp metrics"
  - "collision checking"
  - "grasp quality CNN"
  - "contact points"
  - "grasp width"
  - "two-finger gripper"
  - "grasp refinement"
  - "latent space"
  - "Monte Carlo sampling"
  - "policy network"
  - "domain randomization"
